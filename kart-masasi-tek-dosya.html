<!DOCTYPE html>
<!--
KART MASASI 3D: TEK DOSYA (HTML + CSS + JS içinde). MIT lisansı.

NE: three.js (r128) ile yazılmış 3D, sıra tabanlı, gizli talimatlı blöf kart oyunu. 2-4 kişilik; boş koltuklara bot oturur.
Çevrimdışı (botlarla) ve online (arkadaşlarla) oynanır. Telefon/bilgisayar modu ilk ekranda sorulur. Arayüz Türkçe.

ÇALIŞTIRMA: Bu dosyayı .html olarak kaydedip tarayıcıda aç ya da herhangi bir statik yere index.html diye yükle (Vercel, GitHub Pages, Netlify...).
İnternet gerekir: three.js CDN'den yüklenir (cdnjs, olmazsa jsDelivr, olmazsa unpkg). Online mod herkese açık MQTT aracılarını (WebSocket) kullanır;
sunucu ya da hesap gerekmez. Başka dosya gerekmez.

KURALLAR: Herkes 2 kartla başlar, kalanlar destede. Sıra gelince karta tıkla = ortaya koy, PAS = sırayı geç; istersen tur başına bir kez desteden kart çek
(Al / Ortaya at: ilk kapan alır / Geri koy). Ortada en az 3 kart varken herkes üst üste pas derse oyun biter. Gizli talimatlar:
  Üçlü bonus: 3 kart da ortadaysa herkes +10, değilse herkes -3.   Hain (1 kişi): aynı üçlü tamamlanırsa -15, tamamlanmazsa +10.
  İkili ceza: X ve Y birlikte ortadaysa X'i koyan -10, değilse X'in sahibi +3.   Yalan ödülü: Y kartını başkası koyarsa +8, koymazsa -2.
  Gizli ittifak (3-4 kişi): iki ortağın toplamı diğerlerinin toplamından yüksekse ikisi de +10, değilse -3.   Sabotaj Tozu: kapalı konursa üçlü bonus iptal olur.

KOD HARİTASI (<script> içinde, yaklaşık yukarıdan aşağı):
  sahne: renderer, scene, cam, fit, mk, sprite, faceTex/backTex/shadowTex, cardMesh, showMid/hideMid
  arayüz: R (kural metinleri), say, bubble, hud, deckUI, layout (elim), layoutRow (masadaki sıra), drawRP (parşömen dokusu)
  cihaz + parşömen: setDev, updAct, handMesh, parchTick (bant sökme / el animasyonu), openBig/closeBig, askExit/doExit
  online: clean/esc, relayApi, mqttApi (mqttOpen = kendi küçük MQTT 3.1.1 istemcisi), roomApi, onlineMenu/createRoom/joinRoom, netPeers,
          startOnline, remote, rejoin, sync (host), clientSetup/applyView/feeds (istemci)
  kurulum: buildScene, setup(n, opts: dağıtım, hain, ittifak, talimatlar)
  botlar: claim (doğru/yalan beyan), val, thr, botTurn, sabReact
  tur akışı: next, cont, draw, take, decide, grab, dealDeck, act, finish (puanlama)
  tıklama/klavye/döngü: pointerdown/pointermove/keydown, loop
  efektler (sürüm 2): TABLE (masa grubu), SEAT (bot gövde/halka), KICK+shake, SMK/puff/smokeTex, EASE/flingCard,
                      PXLV/pxMode/pxRatio/applyPx/cyclePx, AC/sfx/nbuf/toggleMute
  Ana durum nesnesi: G (items, holder, thrown, pot, deck, rules, tr=hain, tri=üçlü, cur, my, card, mid...). Zamanlayıcılar later() ile kurulur.

TASARIM KARARLARI (değiştirmeden önce düşün):
  Oyun çıkmaza girmemeli: her talimatın iki sonucu var, ortada en az 3 kart gerekir, herkes pas derse destede kalanlar dağıtılır.
  Sıra PAS'a kadar değişmez. Kart çekmek/almak/ortaya atmak zorunlu değil. Talimatlar gizli; botlar başta talimatlarını doğru ya da yalan açıklar.
  Online: host yetkili (oyun mantığı oda sahibinin tarayıcısında). Taşıma katmanı: join(oda) -> {presence(patch), peers(), onPeers(fn), leave()}.
  presence anahtarları [A-Za-z_][A-Za-z0-9_-]* olmalı, oyuncuya özel veriler DİZİ içinde, metinler clean() ile temiz. Peer kimliği p.peer===NET.me ile karşılaştırılır.
  Çekilen/ortaya atılan kart havada durmaz: masaya, dizilen kartların üstüne düz konur (parlayan çerçeve = kapılabilir). Talimat parşömeni tahta duvara bantlıdır; tıklayınca eller bantı sökerek getirir (havada durmaz). Çıkış her zaman onay ister.
SÜRÜM 2 (bu dosyadaki son geliştirmeler):
  • Halı (masa örtüsü) artık yuvarlak uçlu ve masanın içinde: yanlardan taşmaz (TABLE grubu + 3.46x1.01 düzlem).
  • Ortaya atılan/çekilip atılan kart havadan düşmez: masaya yakın yükseklikten, 265-300 ms'de hızla fırlar, dönerek oturur.
    Yeni kart dizinin ~0.16 birim önüne (kameraya doğru) konar; sonraki atışta eski kart yumuşakça sıraya çekilir.
  • Kart inince: atan botun gövdesi + masa + kamera hafifçe sarsılır (KICK), kartın altında kısa duman pufu (SMK) ve WebAudio sesi.
  • Çok hafif piksel görünüm: render oranı varsayılan 0.82 + image-rendering:pixelated + ince scanline/vinyet katmanı (#px).
    🔲 düğmesi veya P tuşu: hafif → kapalı → belirgin. Ayar localStorage.kmpx içinde.
  • Ek: sıra halkası + bot nefes animasyonu, ses aç/kapa (M, localStorage.kmmute), üçlü CDN yedeği + three.js yüklenemezse bilgi ekranı.
  • Bütün efektler tek dosyada; harici görsel/ses dosyası yok. Masaüstü ve mobil aynı dosyayı kullanır.
BİLİNEN EKSİKLER: 3D yerleşim ve dokunmatik kontroller gerçek cihazlarda az denendi. presence herkese açıktır (başkasının eli teknik olarak okunabilir).
Bot sohbeti hazır cümlelerden. Ses efektleri WebAudio ile sentezlenir (ses dosyası yok). Eski tam proje (sunucu, testler): TUM-KODLAR.txt.
-->
